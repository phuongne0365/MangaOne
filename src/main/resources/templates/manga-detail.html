<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${manga.title} + ' - Chi tiết'">Chi tiết truyện</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
        }

        /* ===== BREADCRUMB BAR ===== */
        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 40px 0;
            color: white;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .breadcrumb-item a { color: #e94560; text-decoration: none; }
        .breadcrumb-item.active { color: #ccc; }
        .breadcrumb-item + .breadcrumb-item::before { color: #888; }

        /* ===== DETAIL CARD ===== */
        .detail-card {
            border: none;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        .btn-add-cart {
            background: #e94560;
            color: white;
            border: none;
            font-weight: 700;
        }
        .btn-add-cart:hover {
            background: #c73652;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background:#1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color:#e94560; font-weight:800; font-size:1.4rem;">
            📚 MangaOne
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="/">Trang Chủ</a></li>
                <li class="nav-item"><a class="nav-link active" href="/kho-truyen">Kho Truyện</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Giỏ Hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Đăng Nhập</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h1><i class="bi bi-info-circle me-2"></i>Chi Tiết Truyện</h1>
        <nav aria-label="breadcrumb" class="mt-2">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/">Trang Chủ</a></li>
                <li class="breadcrumb-item"><a href="/kho-truyen">Kho Truyện</a></li>
                <li class="breadcrumb-item active" style="color: #fff;" th:text="${manga.title}">Tên truyện</li>
            </ol>
        </nav>
    </div>
</div>

<div class="container">
    <div class="row detail-card align-items-start mb-5">
        <div class="col-md-4 text-center mb-4 mb-md-0">
            <img th:src="@{'/' + ${manga.image}}" 
                 class="img-fluid rounded shadow-sm w-100" 
                 alt="Hình ảnh truyện" 
                 style="height: 450px; object-fit: cover; image-rendering: -webkit-optimize-contrast;">
        </div>

        <div class="col-md-8">
            <h2 class="fw-bold text-dark" th:text="${manga.title}">Tên truyện</h2>
            <hr>
            <p><strong>Tác giả:</strong> <span th:text="${manga.author}">Tác giả</span></p>
            
            <p><strong>Thể loại:</strong> 
                <span class="badge bg-primary" th:text="${manga.category != null ? manga.category.categoryName : 'Chưa cập nhật'}"></span>
            </p>
            
            <p><strong>Nhà xuất bản:</strong> 
                <span class="badge bg-secondary" th:text="${manga.publisher != null ? manga.publisher.publisherName : 'Chưa cập nhật'}"></span>
            </p>
            
            <h3 class="text-danger fw-bold my-4" th:text="${#numbers.formatInteger(manga.price, 0, 'COMMA') + ' VNĐ'}">Giá</h3>
            
            <p><strong>Số lượng còn lại:</strong> <span th:text="${manga.stockQuantity}"></span> cuốn</p>

            <p class="text-muted mt-3" th:text="${manga.description}">Mô tả truyện...</p>

            <form th:action="@{/cart/add}" method="post" class="mt-4">
                <input type="hidden" name="mangaId" th:value="${manga.id}" />
                
                <div class="mb-3 d-flex align-items-center">
                    <label for="quantity" class="form-label me-3 mb-0"><strong>Số lượng:</strong></label>
                    <input type="number" id="quantity" name="quantity" class="form-control" style="width: 85px;" value="1" min="1" th:max="${manga.stockQuantity}">
                </div>

                <button type="submit" class="btn btn-add-cart btn-lg px-4 me-2">
                    <i class="bi bi-cart-plus me-1"></i> Thêm vào giỏ hàng
                </button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
            </form>
        </div>
    </div>
</div>

<footer class="py-4 mt-5" style="background:#1a1a2e; color:#aaa;">
    <div class="container text-center">
        <p class="mb-0">© 2025 MangaOne. Bản quyền thuộc nhóm phát triển.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
