<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    </head>

<style>
    :root {
        --primary-pink: #ff477e; /* Chỉ dùng cho giá tiền và nút bấm chính */
        --navy-dark: #1e293b;    /* Màu chữ chính - Navy đậm cực rõ */
        --slate-gray: #64748b;   /* Màu xám cho breadcrumb và nhãn phụ */
        --bg-body: #f1f5f9;      /* Nền xám nhạt nhẹ để làm nổi bật card trắng */
        --border-soft: #e2e8f0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-body);
        color: var(--navy-dark);
        line-height: 1.6;
    }

    /* ===== BREADCRUMB ===== */
    .breadcrumb-wrapper {
        padding: 20px 0;
        background-color: #ffffff;
        border-bottom: 1px solid var(--border-soft);
    }

    .breadcrumb-item a {
        color: var(--slate-gray) !important;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .breadcrumb-item a:hover {
        color: var(--navy-dark) !important;
    }

    .breadcrumb-item.active {
        color: var(--navy-dark) !important;
        font-weight: 700;
    }

    /* ===== MANGA CARD CONTAINER ===== */
    .manga-container {
        background: #ffffff;
        border-radius: 24px;
        padding: 45px;
        box-shadow: 0 10px 40px rgba(30, 41, 59, 0.05);
        border: 1px solid var(--border-soft);
        margin-top: 40px;
    }

   
    .manga-image-wrapper {
        text-align: center;
    }

    .manga-image-wrapper img {
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        border: 1px solid var(--border-soft);
        width: 100%;
        max-width: 480px; /* Tăng kích thước ảnh bìa */
        height: auto;
    }

    /* ===== NÚT YÊU THÍCH & CHIA SẺ KIỂU MỚI (TỐI GIẢN) ===== */
    /* NÚT YÊU THÍCH & CHIA SẺ GỌN GÀNG */
.action-modern-row {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 12px; /* Thu hẹp khoảng cách giữa 2 nút */
}

.btn-modern-action {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px; /* Giảm padding cho nút nhỏ lại */
    background: #ffffff;
    color: #1e293b; 
    font-weight: 700;
    font-size: 0.9rem; /* Giảm size chữ */
    border-radius: 8px; /* Bo góc nhẹ hơn */
    border: 1.5px solid #cbd5e1; /* Viền thanh mảnh hơn */
    transition: all 0.2s ease;
    cursor: pointer;
    line-height: 1;
}

/* Hover Yêu Thích */
.btn-modern-action.heart-btn:hover {
    background: #fff1f2;
    color: #ff477e;
    border-color: #ff477e;
    transform: translateY(-2px);
}

/* Hover Chia Sẻ */
.btn-modern-action.share-btn:hover {
    background: #f0f9ff;
    color: #0ea5e9;
    border-color: #0ea5e9;
    transform: translateY(-2px);
}

.btn-modern-action i {
    font-size: 1rem; /* Icon vừa phải */
}

    /* ===== CHI TIẾT VĂN BẢN ===== */
    .manga-title {
        font-weight: 800;
        font-size: 2.8rem;
        color: var(--navy-dark);
        letter-spacing: -1px;
        margin-bottom: 10px;
    }

    .price-tag {
        font-size: 3rem;
        color: var(--primary-pink);
        font-weight: 800;
        margin: 15px 0;
    }

    .info-label {
        color: var(--slate-gray);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.85rem;
        display: block;
    }

    .info-value {
        color: var(--navy-dark);
        font-weight: 700;
        font-size: 1.1rem;
    }

    /* Box tóm tắt nội dung */
    .summary-box {
        background: #f8fafc;
        border-left: 6px solid var(--navy-dark);
        padding: 25px;
        border-radius: 4px 12px 12px 4px;
        margin: 30px 0;
    }

    .summary-box p {
        color: var(--navy-dark);
        font-size: 1.15rem;
        font-weight: 500;
        margin-bottom: 0;
    }

    /* Nút thêm vào giỏ hàng */
    .btn-buy-now {
        background: var(--primary-pink);
        color: white;
        border-radius: 12px;
        padding: 18px;
        font-weight: 800;
        font-size: 1.1rem;
        border: none;
        transition: 0.3s;
        box-shadow: 0 10px 20px rgba(255, 71, 126, 0.2);
    }

    .btn-buy-now:hover {
        background: #f43f5e;
        transform: translateY(-2px);
        color: white;
    }

    .quantity-select {
        height: 60px;
        border: 2px solid var(--navy-dark);
        border-radius: 12px;
        font-weight: 800;
        color: var(--navy-dark);
        text-align: center;
        font-size: 1.2rem;
    }
</style>

<body>

    <div th:replace="~{fragments/search-popup :: search-popup}"></div>
    <div th:replace="~{fragments/header :: header(activePage='shop')}"></div>

    <div class="breadcrumb-wrapper">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/mangas}" class="text-muted">Cửa hàng</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${manga.title}">Chi tiết</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container pb-5">
        <div class="manga-container">
            <div class="row g-5">
                <div class="col-md-5">
                    <div class="manga-image-wrapper">
                        <img th:src="@{'/' + ${manga.image}}" alt="Manga Cover">
                    </div>
                    
                    <div class="action-modern-row">
                        <button class="btn-modern-action heart-btn">
                            <i class="bi bi-heart-fill"></i>
                            <span>Yêu thích</span>
                        </button>
                        <button class="btn-modern-action share-btn">
                            <i class="bi bi-share-fill"></i>
                            <span>Chia sẻ</span>
                        </button>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="mb-2">
                        <span class="badge bg-dark px-3 py-2" th:text="${manga.category.categoryName}">Thể loại</span>
                    </div>

                    <h1 class="manga-title" th:text="${manga.title}">Tên Truyện</h1>
                    
                    <div class="row mb-4">
                        <div class="col-6 border-end">
                            <span class="info-label">Tác giả</span>
                            <span class="info-value" th:text="${manga.author}">Duy Trần</span>
                        </div>
                        <div class="col-6 ps-4">
                            <span class="info-label">Nhà XB</span>
                            <span class="info-value" th:text="${manga.publisher.publisherName}">Kim Đồng</span>
                        </div>
                    </div>

                    <div class="price-tag" th:text="${#numbers.formatInteger(manga.price, 0, 'COMMA') + ' đ'}">30,000 đ</div>

                    <div class="d-flex gap-4 mb-4">
                        <div class="p-3 border rounded-3 text-center bg-light" style="flex: 1;">
                            <span class="info-label">Trạng thái</span>
                            <span class="text-success fw-bold">Sẵn hàng</span>
                        </div>
                        <div class="p-3 border rounded-3 text-center bg-light" style="flex: 1;">
                            <span class="info-label">Trong kho</span>
                            <span class="info-value"><span th:text="${manga.stockQuantity}">120</span> cuốn</span>
                        </div>
                    </div>

                    <div class="summary-box">
                        <span class="info-label mb-2">Tóm tắt nội dung</span>
                        <p th:text="${manga.description}">Thông tin mô tả rõ ràng, không lo lóa mắt.</p>
                    </div>

                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="mangaId" th:value="${manga.id}" />
                        <div class="row g-3">
                            <div class="col-3">
                                <span class="info-label text-center mb-2">Số lượng</span>
                                <input type="number" name="quantity" class="form-control quantity-select" value="1" min="1" th:max="${manga.stockQuantity}">
                            </div>
                            <div class="col-9 d-flex align-items-end">
                                <button type="submit" class="btn btn-buy-now w-100">
                                    <i class="bi bi-cart-check-fill me-2 fs-5"></i> THÊM VÀO GIỎ HÀNG
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
