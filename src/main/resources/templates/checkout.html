<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    <title>Thanh toán - MangaOne</title>
</head>
<body>
<div th:replace="~{fragments/search-popup :: search-popup}"></div>
<div th:replace="~{fragments/header :: header(activePage='checkout')}"></div>

<main style="min-height: 60vh; background-color: #f8f9fa; padding-bottom: 4rem;">
    <section class="site-banner padding-small"
             style="background: linear-gradient(135deg, #fff0f3 0%, #e3f2fd 100%);
                    border-bottom: 2px solid #eee; margin-bottom: 3rem; padding: 40px 0;">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <h1 class="display-5 fw-bold mb-3" style="color: #1a1a1a;">
                        <i class="bi bi-wallet2 me-2"></i>Thanh toán
                    </h1>
                    <nav class="breadcrumb-container d-flex justify-content-center">
                        <div class="breadcrumb-inner px-4 py-2 bg-white shadow-sm rounded-pill border">
                            <a class="text-decoration-none fw-bold" th:href="@{/}" style="color: #e8517a;">Trang chủ</a>
                            <span class="mx-2 text-muted">/</span>
                            <span class="fw-bold" style="color: #1a1a1a;">Thanh toán</span>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="row g-4 justify-content-center">

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4 p-4 h-100">
                    <h4 class="fw-bold mb-4 border-bottom pb-3">Giỏ hàng của bạn</h4>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted">
                            <tr>
                                <th>Sản phẩm</th>
                                <th class="text-center">SL</th>
                                <th class="text-end">Thành tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:src="${item.manga.image}" alt="Truyện"
                                             class="shadow-sm me-3"
                                             style="width: 60px; height: 85px; object-fit: cover; border-radius: 6px; flex-shrink: 0;"
                                             onerror="this.src='/images/no-image.png'">
                                        <div>
                                            <h6 class="mb-1 fw-bold text-dark" th:text="${item.manga.title}"></h6>
                                            <small class="text-danger" th:text="${#numbers.formatDecimal(item.manga.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></small>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center fw-semibold" th:text="${item.quantity}"></td>
                                <td class="text-end text-danger fw-bold" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <span class="fs-5 fw-bold text-danger">Tổng thanh toán:</span>
                        <span class="fs-4 fw-bold text-danger" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm border-0 rounded-4 p-4 sticky-top" style="top: 20px;">
                    <h4 class="fw-bold mb-4 border-bottom pb-3">Thông tin giao hàng</h4>

                    <!-- Form checkout tất cả -->
                    <form th:if="${!isPartialCheckout}"  action="/checkout" method="post">
                        <div class="mb-3">
                            <label for="receiverName" class="form-label text-danger fw-semibold">
                                Họ và tên người nhận <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="receiverNameSelected"
                                   name="receiverName"
                                   class="form-control bg-light"
                                   th:value="${user.fullName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="receiverPhone" class="form-label text-danger fw-semibold">
                                Số điện thoại <span class="text-danger">*</span>
                            </label>
                            <input type="tel"
                                   id="receiverPhoneSelected"
                                   name="receiverPhone"
                                   class="form-control bg-light"
                                   th:value="${user.phoneNumber}"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="shippingAddress" class="form-label text-danger fw-semibold">
                                Địa chỉ nhận hàng <span class="text-danger">*</span>
                            </label>
                            <textarea id="shippingAddressSelected"
                                      name="shippingAddress"
                                      class="form-control bg-light"
                                      rows="3"
                                      required
                                      th:text="${user.address}"></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                            Xác nhận đặt hàng <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <!-- Form checkout selected -->
                    <form th:if="${isPartialCheckout}" id="checkoutForm" action="/checkout/selected" method="post">
                        <!-- Hidden inputs cho cartIds -->
                        <input type="hidden" name="cartIds" th:each="cartId : ${cartIds}" th:value="${cartId}" />

                        <div class="mb-3">
                            <label for="receiverName" class="form-label text-danger fw-semibold">
                                Họ và tên người nhận <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="receiverName"
                                   name="receiverName"
                                   class="form-control bg-light"
                                   th:value="${user.fullName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="receiverPhone" class="form-label text-danger fw-semibold">
                                Số điện thoại <span class="text-danger">*</span>
                            </label>
                            <input type="tel"
                                   id="receiverPhone"
                                   name="receiverPhone"
                                   class="form-control bg-light"
                                   th:value="${user.phoneNumber}"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="shippingAddress" class="form-label text-danger fw-semibold">
                                Địa chỉ nhận hàng <span class="text-danger">*</span>
                            </label>
                            <textarea id="shippingAddress"
                                      name="shippingAddress"
                                      class="form-control bg-light"
                                      rows="3"
                                      required
                                      th:text="${user.address}"></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                            Xác nhận đặt hàng <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center">
                        <a th:href="@{/cart}" class="text-decoration-none text-danger fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại giỏ hàng
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="~{fragments/customer-review :: customer-review}"></div>
<div th:replace="~{fragments/instagram :: instagram}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
