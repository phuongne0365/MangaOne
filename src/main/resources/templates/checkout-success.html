<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
  <title>Đặt hàng thành công - MangaOne</title>
</head>
<body>
<div th:replace="~{fragments/search-popup :: search-popup}"></div>
<div th:replace="~{fragments/header :: header(activePage='checkout')}"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="text-center">
        <div class="alert alert-success" role="alert">
          <h4 class="alert-heading">🎉 Chúc mừng!</h4>
          <p>Đơn hàng của bạn đã được đặt thành công. Chúng tôi sẽ xử lý và giao hàng trong thời gian sớm nhất.</p>
          <hr>
          <p class="mb-0">Cảm ơn bạn đã tin tưởng và mua sắm tại MangaOne!</p>
        </div>
        <div class="mt-4">
          <a th:href="@{/cart}" class="btn btn-primary btn-lg me-3">Quay lại giỏ hàng</a>
          <a th:href="@{/kho-truyen}" class="btn btn-outline-primary btn-lg">Tiếp tục mua sắm</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/customer-review :: customer-review}"></div>
<div th:replace="~{fragments/instagram :: instagram}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
