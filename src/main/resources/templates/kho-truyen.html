<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Truyện - MangaOne</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/vendor.css}">
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
        }

        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 50px 0;
            color: white;
        }
        .page-header h1 {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .breadcrumb-item a { color: #e94560; text-decoration: none; }
        .breadcrumb-item.active { color: #ccc; }
        .breadcrumb-item + .breadcrumb-item::before { color: #888; }

        .manga-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #fff;
            height: 100%;
        }
        .manga-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.15);
        }
        .manga-card .img-wrapper {
            position: relative;
            overflow: hidden;
            height: 280px;
            background: #e9ecef;
        }
        .manga-card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .manga-card:hover .img-wrapper img {
            transform: scale(1.07);
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .manga-card .overlay-btn {
            position: absolute;
            bottom: -50px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            transition: bottom 0.3s ease;
            padding: 10px;
        }
        .manga-card:hover .overlay-btn { bottom: 10px; }
        .overlay-btn .btn {
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 20px;
            padding: 6px 16px;
        }

        .manga-card .card-body { padding: 16px; }
        .manga-card .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .manga-card .card-author {
            font-size: 0.82rem;
            color: #6c757d;
            margin-bottom: 10px;
        }
        .manga-card .card-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: #e94560;
        }

        .filter-bar {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .filter-bar .form-control,
        .filter-bar .form-select {
            border-radius: 8px;
            border: 1.5px solid #dee2e6;
            font-size: 0.9rem;
        }
        .filter-bar .form-control:focus,
        .filter-bar .form-select:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.15);
        }
        .btn-search {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            padding: 8px 24px;
        }
        .btn-search:hover { background: #c73652; color: white; }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #6c757d;
        }
        .empty-state i { font-size: 4rem; color: #dee2e6; }
    </style>
</head>
<body>

	<div th:replace="~{fragments/search-popup :: search-popup}"></div>
	<div th:replace="~{fragments/header :: header(activePage='mangas')}"></div>

	<section class="site-banner padding-small" 
	         style="background: linear-gradient(135deg, #fff0f3 0%, #e3f2fd 100%); 
	                border-bottom: 2px solid #eee; margin-bottom: 4rem; padding: 60px 0;">
	  <div class="container">
	    <div class="row">
	      <div class="col-md-12 text-center">
	        <h1 class="display-3 fw-bold mb-2" 
	            style="color: #1a1a1a !important; text-shadow: 2px 2px 4px rgba(0,0,0,0.05); letter-spacing: -1px;">
	            Kho Truyện
	        </h1>
	        
	        <nav class="breadcrumb-container d-flex justify-content-center">
	          <div class="breadcrumb-inner px-4 py-2 bg-white shadow-sm rounded-pill border">
	            <a class="text-decoration-none fw-bold" th:href="@{/}" style="color: #ff4545 !important;">Home</a>
	            <span class="mx-3" style="color: #333; font-weight: bold;">/</span>
	            <span class="fw-bold" style="color: #1a1a1a !important;">Kho truyện</span>
	          </div>
	        </nav>
	      </div>
	    </div>
	  </div>
	</section>
	<div class="container my-5">
	
	    <!-- FILTER BAR -->
	    <div class="filter-bar mb-4">
	        <form th:action="@{/mangas}" method="get">
	        <div class="row g-3 align-items-center">
	            <div class="col-md-5">
	                <div class="input-group">
	                    <button type="submit" class="input-group-text bg-white border-end-0"
	                            style="cursor:pointer; border: 1.5px solid #dee2e6; border-radius: 8px 0 0 8px;">
	                        <i class="bi bi-search text-muted"></i>
	                    </button>
	                    <input type="text" name="keyword" class="form-control"
	                           placeholder="Tìm tên truyện, tác giả..."
	                           th:value="${keyword}"
	                           style="border-left: none; border-radius: 0 8px 8px 0;">
	                </div>
	            </div>
	            <div class="col-md-3">
	                <select name="category_id" class="form-select">
	                    <option value="">-- Tất cả thể loại --</option>
	                    <option th:each="cat : ${categories}"
	                            th:value="${cat.categoryId}"
	                            th:text="${cat.categoryName}"
	                            th:selected="${cat.categoryId == categoryId}">
	                    </option>
	                </select>
	            </div>
	            <div class="col-md-2">
	                <select name="sortBy" class="form-select">
	                    <option value=""           th:selected="${sortBy == ''}">-- Sắp xếp --</option>
	                    <option value="price_asc"  th:selected="${sortBy == 'price_asc'}">Giá tăng dần</option>
	                    <option value="price_desc" th:selected="${sortBy == 'price_desc'}">Giá giảm dần</option>
	                    <option value="name_asc"   th:selected="${sortBy == 'name_asc'}">Tên A-Z</option>
	                </select>
	            </div>
	            <div class="col-md-2">
	                <button type="submit" class="btn btn-search w-100">
	                    <i class="bi bi-funnel me-1"></i>Lọc
	                </button>
	            </div>
	        </div>
	        </form>
	    </div>
	
	    <!-- SỐ LƯỢNG KẾT QUẢ -->
	    <div class="d-flex justify-content-between align-items-center mb-3">
	        <p class="text-muted mb-0">
	            Tìm thấy <strong th:text="${#lists.size(mangas)}">0</strong> đầu truyện
	            <span th:if="${keyword != null and !keyword.isEmpty()}">
	                với từ khóa: <strong th:text="${keyword}"></strong>
	            </span>
	        </p>
	        <a th:if="${keyword != null and !keyword.isEmpty() or categoryId != null}"
	           href="/mangas" class="btn btn-sm btn-outline-secondary">
	            <i class="bi bi-x-lg me-1"></i>Xóa bộ lọc
	        </a>
	    </div>
	
	    <!-- GRID DANH SÁCH TRUYỆN -->
	    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-4"
	         th:if="${mangas != null and !mangas.isEmpty()}">
	
	        <div class="col" th:each="manga : ${mangas}">
	            <div class="manga-card card h-100 shadow-sm">
	
	                <div class="img-wrapper">
	                    <img th:src="@{'/' + ${manga.image}}"
	                         th:alt="${manga.title}"
	                         onerror="this.src='/images/manga/default.jpg'">
	
	                    <span class="stock-badge bg-danger text-white"
	                          th:if="${manga.stockQuantity == null or manga.stockQuantity <= 0}">
	                        Hết hàng
	                    </span>
	
	                    <span class="stock-badge text-white" style="background:#f07830;"
	                          th:if="${manga.stockQuantity != null and manga.stockQuantity > 0 and manga.stockQuantity < 5}">
	                        Sắp hết
	                    </span>
	
	                    <span class="stock-badge bg-success text-white"
	                          th:if="${manga.stockQuantity != null and manga.stockQuantity >= 5}">
	                        Còn hàng
	                    </span>
	
	                    <div class="overlay-btn">
	                        <a th:href="@{'/manga/' + ${manga.id}}" class="btn btn-danger btn-sm">
	                            <i class="bi bi-eye"></i> Xem
	                        </a>
	                        <form th:action="@{/cart/add}" method="post">
	                            <input type="hidden" name="mangaId" th:value="${manga.id}">
	                            <input type="hidden" name="quantity" value="1">
	                            <button type="submit" class="btn btn-danger btn-sm"
	                                    th:disabled="${manga.stockQuantity == null or manga.stockQuantity <= 0}">
	                                <i class="bi bi-cart-plus"></i> Thêm
	                            </button>
	                        </form>
	                    </div>
	                </div>
	
	                <div class="card-body d-flex flex-column">
	                    <h6 class="card-title" th:text="${manga.title}">Tên Truyện</h6>
	
	                    <p class="card-author">
	                        <i class="bi bi-person me-1"></i>
	                        <span th:text="${manga.author}">Tác giả</span>
	                    </p>
	
	                    <div class="mt-auto d-flex justify-content-between align-items-center">
	                        <span class="card-price"
	                              th:text="${#numbers.formatDecimal(manga.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">
	                            0 VNĐ
	                        </span>
	                    </div>
	                </div>
	
	            </div>
	        </div>
	
	    </div>
	
	    <!-- EMPTY STATE -->
	    <div class="empty-state" th:if="${mangas == null or mangas.isEmpty()}">
	        <i class="bi bi-journal-x d-block mb-3"></i>
	        <h5>Chưa có truyện nào trong kho</h5>
	        <p>Hãy thêm truyện vào Database để hiển thị tại đây.</p>
	    </div>
	
	    <!-- ===== PHÂN TRANG ===== -->
	    <div class="d-flex justify-content-center mt-5" th:if="${totalPages > 1}">
	        <nav>
	            <ul class="pagination">
	                <!-- Nút Trước -->
	                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
	                    <a class="page-link"
	                       th:href="@{/mangas(page=${currentPage - 1}, keyword=${keyword}, category_id=${categoryId}, sortBy=${sortBy})}">
	                        <i class="bi bi-chevron-left"></i>
	                    </a>
	                </li>
	
	                <!-- Các số trang -->
	                <li class="page-item"
	                    th:each="i : ${#numbers.sequence(1, totalPages)}"
	                    th:classappend="${i == currentPage} ? 'active'">
	                    <a class="page-link"
	                       th:href="@{/mangas(page=${i}, keyword=${keyword}, category_id=${categoryId}, sortBy=${sortBy})}"
	                       th:text="${i}">1</a>
	                </li>
	
	                <!-- Nút Sau -->
	                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
	                    <a class="page-link"
	                       th:href="@{/mangas(page=${currentPage + 1}, keyword=${keyword}, category_id=${categoryId}, sortBy=${sortBy})}">
	                        <i class="bi bi-chevron-right"></i>
	                    </a>
	                </li>
	            </ul>
	        </nav>
	    </div>
	
	    <!-- Thông tin trang -->
	    <p class="text-center text-muted mt-2" th:if="${totalPages > 1}"
	       th:text="'Trang ' + ${currentPage} + ' / ' + ${totalPages} + ' — Tổng ' + ${totalItems} + ' truyện'"></p>
	
	</div><!-- end container -->

	<div th:replace="~{fragments/instagram :: instagram}"></div>
	<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
