<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MangaOne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Hoa văn manga nền */
        body::before {
            content: '📚 ⚔️ 🌸 💫 🎌 📖 ✨ 🗡️ 🌙 🎭';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            font-size: 2rem;
            opacity: 0.04;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 60px;
            padding: 40px;
            pointer-events: none;
            word-break: break-all;
            letter-spacing: 40px;
            line-height: 80px;
        }
        .login-wrapper {
            display: flex;
            width: 900px;
            max-width: 95vw;
            min-height: 540px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        /* Cột trái - ảnh manga */
        .login-banner {
            flex: 1;
            background: linear-gradient(160deg, #e94560 0%, #c73652 40%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .login-banner::before {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        .login-banner::after {
            content: '';
            position: absolute;
            bottom: -80px; left: -40px;
            width: 250px; height: 250px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        .login-banner .logo {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .login-banner h2 {
            font-weight: 800;
            font-size: 1.8rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .login-banner p {
            font-size: 0.95rem;
            opacity: 0.85;
            text-align: center;
            line-height: 1.6;
        }
        .manga-icons {
            display: flex;
            gap: 16px;
            margin-top: 30px;
            font-size: 2rem;
        }
        /* Cột phải - form */
        .login-form-box {
            flex: 1;
            background: #fff;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form-box h3 {
            font-weight: 800;
            font-size: 1.6rem;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .login-form-box .subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .form-label {
            font-weight: 700;
            font-size: 0.88rem;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .form-control {
            border: 1.5px solid #dee2e6;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233,69,96,0.4);
            color: white;
        }
        .divider {
            text-align: center;
            color: #aaa;
            font-size: 0.85rem;
            margin: 20px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: #dee2e6;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .register-link {
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .register-link a {
            color: #e94560;
            font-weight: 700;
            text-decoration: none;
        }
        .register-link a:hover { text-decoration: underline; }
        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            transition: color 0.2s;
        }
        .back-home:hover { color: #e94560; }

        @media (max-width: 640px) {
            .login-banner { display: none; }
            .login-form-box { padding: 40px 24px; }
        }
    </style>
</head>
<body>

<!-- Nút về trang chủ -->
<a href="/" class="back-home">
    <i class="bi bi-arrow-left"></i> Về trang chủ
</a>

<div class="login-wrapper">
    <!-- CỘT TRÁI - Banner Manga -->
    <div class="login-banner">
        <div class="logo">📚</div>
        <h2>MangaOne</h2>
        <p>Thế giới truyện tranh<br>không giới hạn dành cho bạn</p>
        <div class="manga-icons">
            <span title="Hành động">⚔️</span>
            <span title="Lãng mạn">🌸</span>
            <span title="Phiêu lưu">🗺️</span>
            <span title="Kinh dị">🌙</span>
        </div>
    </div>

    <!-- CỘT PHẢI - Form đăng nhập -->
    <div class="login-form-box">
        <h3>Chào mừng trở lại! 👋</h3>
        <p class="subtitle">Đăng nhập để tiếp tục đọc truyện yêu thích</p>

        <!-- Hiển thị lỗi nếu có -->
        <div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></div>

        <!-- FORM ĐĂNG NHẬP - giữ nguyên action /login -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">📧 Địa chỉ Email</label>
                <input type="email" name="email" class="form-control"
                       placeholder="Nhập email của bạn" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">🔒 Mật khẩu</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
            </button>
        </form>

        <div class="divider">hoặc</div>

        <div class="register-link">
            Chưa có tài khoản?
            <a href="/register">Đăng ký ngay miễn phí</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dark/Light Mode Toggle -->
<div style="position:fixed;top:20px;right:20px;z-index:200;display:flex;align-items:center;gap:8px;">
  <span style="font-size:0.8rem;font-weight:600;" id="mode-label">🌙 Tối</span>
  <div onclick="toggleMode()" id="mode-track"
       style="width:52px;height:28px;background:rgba(255,255,255,0.2);border-radius:14px;
              cursor:pointer;position:relative;border:1px solid rgba(255,255,255,0.3);transition:background 0.3s;">
    <div id="mode-thumb"
         style="position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;
                background:white;transition:transform 0.3s;display:flex;align-items:center;
                justify-content:center;font-size:0.65rem;">🌙</div>
  </div>
</div>

<!-- Đèn bật/tắt -->
<div id="lamp-wrap" onclick="toggleLamp()"
     style="position:fixed;bottom:24px;left:24px;z-index:9999;
            display:flex;flex-direction:column;align-items:center;cursor:pointer;"
     title="Bật/Tắt đèn">
  <div id="lamp-bulb"
       style="width:48px;height:48px;border-radius:50%;
              background:radial-gradient(circle at 40% 35%,#fffde0,#f9c74f);
              box-shadow:0 0 22px 10px rgba(249,199,79,0.7);
              border:2px solid #f4a100;transition:all 0.4s;"></div>
  <div style="width:2px;height:22px;background:rgba(200,200,200,0.4);"></div>
  <div style="width:30px;height:6px;background:rgba(200,200,200,0.3);border-radius:3px;"></div>
  <span style="color:rgba(255,255,255,0.5);font-size:0.65rem;margin-top:4px;font-weight:600;">Đèn (click)</span>
</div>
<!-- Overlay tối khi tắt đèn -->
<div id="lamp-overlay"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:9990;"></div>

<script>
// ===== DARK / LIGHT MODE =====
var isDark = true;
function toggleMode() {
  isDark = !isDark;
  var label = document.getElementById('mode-label');
  var thumb = document.getElementById('mode-thumb');
  var track = document.getElementById('mode-track');
  var formBox = document.querySelector('.login-form-box');
  if (isDark) {
    document.body.style.background = '';
    label.style.color = 'rgba(255,255,255,0.8)';
    label.textContent = '🌙 Tối';
    thumb.style.transform = 'translateX(0)';
    thumb.textContent = '🌙';
    track.style.background = 'rgba(255,255,255,0.2)';
    if (formBox) { formBox.style.background = '#fff'; formBox.style.color = ''; }
  } else {
    document.body.style.background = 'linear-gradient(135deg,#f0f4ff 0%,#e8ecf8 50%,#dde3f5 100%)';
    label.style.color = '#1a1a2e';
    label.textContent = '☀️ Sáng';
    thumb.style.transform = 'translateX(24px)';
    thumb.textContent = '☀️';
    track.style.background = '#f9c74f';
    if (formBox) { formBox.style.background = '#fff'; }
  }
}

// ===== ĐÈN BẬT / TẮT =====
var lampOn = true;
function toggleLamp() {
  lampOn = !lampOn;
  var bulb    = document.getElementById('lamp-bulb');
  var overlay = document.getElementById('lamp-overlay');
  if (lampOn) {
    bulb.style.background = 'radial-gradient(circle at 40% 35%,#fffde0,#f9c74f)';
    bulb.style.boxShadow  = '0 0 22px 10px rgba(249,199,79,0.7)';
    bulb.style.border     = '2px solid #f4a100';
    overlay.style.display = 'none';
  } else {
    bulb.style.background = '#222';
    bulb.style.boxShadow  = 'none';
    bulb.style.border     = '2px solid #444';
    overlay.style.display = 'block';
  }
}
</script>

</body>
</html>
