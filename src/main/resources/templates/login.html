<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MangaOne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('images/banner-image-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Lớp tối phủ lên ảnh nền */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 26, 0.62);
            backdrop-filter: blur(2px);
            z-index: 0;
        }

        /* Nút về trang chủ */
        .back-home {
            position: fixed;
            top: 22px;
            left: 22px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .back-home:hover {
            background: rgba(233,69,96,0.85);
            border-color: transparent;
            color: #fff;
        }

        /* Card form */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 44px 40px 36px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
            margin: 20px;
        }

        /* Logo */
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .auth-logo img {
            height: 64px;
            width: auto;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .auth-subtitle {
            color: #6c757d;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }

        /* Input */
        .form-label {
            font-weight: 700;
            font-size: 0.82rem;
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .bi {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }
        .form-control {
            border: 1.5px solid #e8e8e8;
            border-radius: 11px;
            padding: 11px 14px 11px 40px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.93rem;
            transition: all 0.2s;
            background: #fafafa;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.12);
            background: #fff;
            outline: none;
        }
        .form-control:focus + .bi,
        .input-wrap:focus-within .bi {
            color: #e94560;
        }

        /* Nút submit */
        .btn-auth {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
            border: none;
            border-radius: 11px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.97rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 4px;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(233,69,96,0.4);
        }
        .btn-auth:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            text-align: center;
            color: #ccc;
            font-size: 0.82rem;
            margin: 18px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ececec;
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        /* Link chuyển trang */
        .auth-switch {
            text-align: center;
            font-size: 0.88rem;
            color: #6c757d;
        }
        .auth-switch a {
            color: #e94560;
            font-weight: 700;
            text-decoration: none;
        }
        .auth-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>

	<a href="/" class="back-home">
	    <i class="bi bi-arrow-left"></i> Về trang chủ
	</a>

	<div class="auth-card">
	
	    <!-- Logo -->
	    <div class="auth-logo">
	        <img th:src="@{/images/logo-trang.png}" src="images/logo-trang.png" alt="MangaOne">
	    </div>
	
	    <h3 class="auth-title">Chào mừng trở lại! 👋</h3>
	    <p class="auth-subtitle">Đăng nhập để tiếp tục đọc truyện yêu thích</p>
	
	    <!-- Thông báo lỗi đăng nhập -->
	    <!-- Kiểm tra cả ${loginError} (từ HomeController/session)
	         lẫn Spring Security param ?error -->
	    <div th:if="${loginError}" class="alert alert-danger py-2 mb-3 rounded-3">
	        <i class="bi bi-exclamation-triangle-fill me-2"></i>
	        <span th:text="${loginError}"></span>
	    </div>
	    <div th:if="${param.error}" class="alert alert-danger py-2 mb-3 rounded-3"
	         th:unless="${loginError}">
	        <i class="bi bi-exclamation-triangle-fill me-2"></i>
	        Sai email hoặc mật khẩu. Vui lòng thử lại!
	    </div>
	    <!-- Thông báo đăng ký thành công -->
	    <div th:if="${registerSuccess}" class="alert alert-success py-2 mb-3 rounded-3">
	        <i class="bi bi-check-circle-fill me-2"></i>
	        <span th:text="${registerSuccess}"></span>
	    </div>
	
	    <form th:action="@{/login}" method="post">
	
	        <div class="mb-3">
	            <label class="form-label">Email</label>
	            <div class="input-wrap">
	                <input type="email" name="email" class="form-control"
	                       placeholder="example@email.com" required autofocus>
	                <i class="bi bi-envelope"></i>
	            </div>
	        </div>
	
	        <div class="mb-4">
	            <label class="form-label">Mật khẩu</label>
	            <div class="input-wrap">
	                <input type="password" name="password" class="form-control"
	                       placeholder="Nhập mật khẩu" required>
	                <i class="bi bi-lock"></i>
	            </div>
	        </div>
	
	        <button type="submit" class="btn-auth">
	            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
	        </button>
	
	    </form>
	
	    <div class="divider">hoặc</div>
	
	    <div class="auth-switch">
	        Chưa có tài khoản? <a href="/register">Đăng ký ngay miễn phí →</a>
	    </div>
	
	    <div class="auth-switch mt-2">
	        <a href="/?openLogin=true" style="color:#6c757d;font-weight:400;">
	            <i class="bi bi-grid-1x2 me-1"></i>Đăng nhập qua trang chủ
	        </a>
	    </div>
	
	</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
