<!DOCTYPE html>
<!--
  FILE: admin-layout.html
  Đường dẫn: src/main/resources/templates/admin/admin-layout.html

  File này là "khung xương" (Fragment Layout) cho toàn bộ trang Admin.
  Cách dùng: Các trang con (dashboard.html, inventory.html...) sẽ
  nhúng layout này bằng cú pháp Thymeleaf Fragment:

    <html th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::main})}">

  Điều này giúp Sidebar + Header chỉ viết 1 lần, dùng cho mọi trang Admin.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MangaOne Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* ── CSS Variables khớp màu sắc MangaOne (coral/pink accent) ── */
    :root {
      --primary:     #e8517a;   /* Màu chủ đạo — coral hồng như website */
      --primary-soft:#fdf0f4;   /* Nền nhạt của primary */
      --sidebar-w:   260px;
      --header-h:    64px;
      --sidebar-bg:  #1a1d2e;   /* Sidebar nền tối */
      --sidebar-text:#a8b0c8;
      --sidebar-active:#ffffff;
      --bg-main:     #f4f6fb;
      --card-shadow: 0 2px 12px rgba(0,0,0,.07);
      --radius:      12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg-main); color: #2d3142; }

    /* ══════════════ SIDEBAR ══════════════ */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      z-index: 1000; overflow: hidden;
      transition: width .25s ease;
    }

    /* Logo vùng trên sidebar */
    .sidebar-logo {
      height: var(--header-h);
      display: flex; align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      flex-shrink: 0;
    }
    .sidebar-logo .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; font-weight: 800; flex-shrink: 0;
    }
    .sidebar-logo .logo-text {
      color: #fff; font-size: 17px; font-weight: 800;
      margin-left: 12px; letter-spacing: -.3px;
    }
    .sidebar-logo .logo-badge {
      font-size: 9px; background: var(--primary);
      color: #fff; border-radius: 4px; padding: 1px 5px;
      margin-left: 8px; font-weight: 700; letter-spacing: .5px;
    }

    /* Menu nav */
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

    .nav-section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      color: rgba(168,176,200,.5); text-transform: uppercase;
      padding: 12px 20px 6px;
    }

    .nav-item { margin: 2px 10px; }
    .nav-link {
      display: flex; align-items: center;
      padding: 11px 14px; border-radius: 10px;
      color: var(--sidebar-text); font-weight: 600; font-size: 14px;
      text-decoration: none; transition: all .2s;
      white-space: nowrap;
    }
    .nav-link i { font-size: 17px; width: 22px; flex-shrink: 0; }
    .nav-link span { margin-left: 12px; }
    .nav-link:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nav-link.active {
      background: var(--primary); color: #fff;
      box-shadow: 0 4px 12px rgba(232,81,122,.35);
    }
    .nav-link .badge-count {
      margin-left: auto; background: rgba(255,255,255,.15);
      color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 20px; padding: 2px 8px;
    }
    .nav-link.active .badge-count { background: rgba(255,255,255,.25); }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-user .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .sidebar-user .user-info .name { color: #fff; font-size: 13px; font-weight: 700; }
    .sidebar-user .user-info .role { color: var(--sidebar-text); font-size: 11px; }

    /* ══════════════ HEADER ══════════════ */
    #header {
      position: fixed; top: 0;
      left: var(--sidebar-w); right: 0;
      height: var(--header-h);
      background: #fff;
      border-bottom: 1px solid #edf0f7;
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
      z-index: 999;
      box-shadow: 0 1px 8px rgba(0,0,0,.04);
    }

    .header-search {
      flex: 1; max-width: 320px;
      display: flex; align-items: center;
      background: var(--bg-main); border-radius: 10px;
      padding: 8px 14px; gap: 8px;
    }
    .header-search i { color: #aab; font-size: 15px; }
    .header-search input {
      border: none; background: transparent; outline: none;
      font-size: 14px; font-family: 'Nunito', sans-serif; width: 100%; color: #2d3142;
    }

    .header-spacer { flex: 1; }

    .header-action {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg-main); display: flex;
      align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: background .2s;
    }
    .header-action:hover { background: #edf0f7; }
    .header-action i { font-size: 17px; color: #5a6080; }
    .notif-dot {
      position: absolute; top: 8px; right: 8px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--primary); border: 1.5px solid #fff;
    }

    .header-admin {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; border-radius: 10px;
      cursor: pointer; transition: background .2s;
    }
    .header-admin:hover { background: var(--bg-main); }
    .header-admin .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #f07);
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 13px;
    }
    .header-admin .admin-info .name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .header-admin .admin-info .role { font-size: 11px; color: #8890aa; }

    /* ══════════════ MAIN CONTENT ══════════════ */
    #main-content {
      margin-left: var(--sidebar-w);
      margin-top: var(--header-h);
      padding: 28px;
      min-height: calc(100vh - var(--header-h));
    }

    /* ══════════════ CARDS DÙNG CHUNG ══════════════ */
    .stat-card {
      background: #fff; border-radius: var(--radius);
      padding: 22px 24px; box-shadow: var(--card-shadow);
      border: 1px solid #f0f2f8;
      display: flex; align-items: center; gap: 18px;
      transition: transform .2s, box-shadow .2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.1); }
    .stat-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .stat-icon.pink    { background: #fdf0f4; color: var(--primary); }
    .stat-icon.orange  { background: #fff5ec; color: #f07830; }
    .stat-icon.red     { background: #fff0f0; color: #e03; }
    .stat-icon.green   { background: #edfaf4; color: #18b86e; }
    .stat-value { font-size: 26px; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 13px; color: #8890aa; margin-top: 4px; font-weight: 600; }
    .stat-change { font-size: 12px; font-weight: 700; margin-top: 6px; }
    .stat-change.up { color: #18b86e; }
    .stat-change.warn { color: #f07830; }
    .stat-change.danger { color: #e03; }

    /* ══════════════ TABLE ══════════════ */
    .content-card {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--card-shadow); border: 1px solid #f0f2f8;
      overflow: hidden;
    }
    .content-card-header {
      padding: 18px 24px; display: flex;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f0f2f8;
    }
    .content-card-header h5 {
      font-size: 15px; font-weight: 800; margin: 0;
    }
    .table { margin: 0; font-size: 14px; }
    .table thead th {
      background: #f8faff; color: #8890aa;
      font-size: 11px; font-weight: 700; letter-spacing: .7px;
      text-transform: uppercase; border: none; padding: 12px 20px;
    }
    .table tbody td { padding: 14px 20px; border-color: #f0f2f8; vertical-align: middle; }
    .table tbody tr:last-child td { border: none; }
    .table tbody tr:hover { background: #fafbff; }

    /* Stock badges */
    .stock-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }
    .stock-badge.out    { background: #fff0f0; color: #e03; }
    .stock-badge.low    { background: #fff5ec; color: #f07830; }
    .stock-badge.ok     { background: #edfaf4; color: #18b86e; }

    /* Page title */
    .page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .page-subtitle { font-size: 14px; color: #8890aa; margin-bottom: 24px; }
    .breadcrumb { font-size: 13px; }
    .breadcrumb-item + .breadcrumb-item::before { color: #aab; }
  </style>
</head>

<!-- ═══════════════════════════════════════════════════════════════════
     THYMELEAF FRAGMENT: layout(pageTitle, content)
     Cú pháp gọi từ trang con:
       <html th:replace="~{admin/admin-layout :: layout(~{::title}, ~{::section#content})}">
═══════════════════════════════════════════════════════════════════ -->
<body >

<!-- ══════════════ SIDEBAR ══════════════ -->
<aside id="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">M</div>
    <span class="logo-text">MangaOne</span>
    <span class="logo-badge">ADMIN</span>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <p class="nav-section-label">Tổng quan</p>
    <div class="nav-item">
      <a th:href="@{/admin/dashboard}" class="nav-link"
   th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
    <i class="bi bi-speedometer2"></i>
    <span>Dashboard</span>
</a>
    </div>

    <p class="nav-section-label">Quản lý</p>
    <div class="nav-item">
      <a th:href="@{/admin/mangas}" class="nav-link"
   th:classappend="${currentPage == 'mangas'} ? 'active' : ''">
    <i class="bi bi-book"></i>
    <span>Quản lý truyện</span>
</a>
    </div>
    <div class="nav-item">
      <a th:href="@{/admin/inventory}" class="nav-link"
   th:classappend="${currentPage == 'inventory'} ? 'active' : ''">
    <i class="bi bi-boxes"></i>
    <span>Quản lý kho</span>
</a>
    </div>
    <div class="nav-item">
      <a th:href="@{/admin/orders}" class="nav-link"
   th:classappend="${currentPage == 'orders'} ? 'active' : ''">
    <i class="bi bi-receipt"></i>
    <span>Quản lý đơn hàng</span>
</a>
    </div>

    <p class="nav-section-label">Hệ thống</p>
    <div class="nav-item">
      <a th:href="@{/}" class="nav-link">
        <i class="bi bi-house"></i>
        <span>Về trang chủ</span>
      </a>
    </div>
    <div class="nav-item">
      <a th:href="@{/logout}" class="nav-link">
        <i class="bi bi-box-arrow-right"></i>
        <span>Đăng xuất</span>
      </a>
    </div>
  </nav>

  <!-- User info dưới sidebar -->
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="avatar">A</div>
      <div class="user-info">
        <div class="name">Admin</div>
        <div class="role">Quản trị viên</div>
      </div>
    </div>
  </div>
</aside>

<!-- ══════════════ HEADER ══════════════ -->
<header id="header">
  <!-- Thanh tìm kiếm -->
  <div class="header-search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Tìm kiếm truyện, đơn hàng..."/>
  </div>

  <div class="header-spacer"></div>

  <!-- Nút thông báo -->
  <div class="header-action">
    <i class="bi bi-bell"></i>
    <span class="notif-dot"></span>
  </div>

  <!-- Nút cài đặt -->
  <div class="header-action">
    <i class="bi bi-gear"></i>
  </div>

  <!-- Avatar Admin -->
  <div class="header-admin">
    <div class="avatar">A</div>
    <div class="admin-info">
      <div class="name">Admin</div>
      <div class="role">Quản trị viên</div>
    </div>
  </div>
</header>

<!-- ══════════════ MAIN CONTENT (nội dung trang con nhúng vào đây) ══════════════ -->
<main id="main-content">
  <!-- th:replace nhúng nội dung từ trang con vào đây -->
  <div th:replace="${content}">
    <!-- Placeholder khi chưa có nội dung -->
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
